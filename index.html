<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="https://turntables.dev/favicon.png" type="image/png">
	<title>turntables.dev</title>
	<style>
		@font-face {
			font-family: Asap;
			src: url("https://turntables.dev/Asap-VariableFont_wdth,wght.ttf") format("truetype");
			font-weight: 100 900;
		}

		:root {
			color-scheme: dark;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #333333;
			color: #ffffff;
			font-family: Asap, sans-serif;
		}

		main {
			width: min(90%, 620px);
			text-align: center;
		}

		img {
			display: block;
			width: min(100%, 360px);
			margin: 0 auto 2rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.2rem, 7vw, 4.5rem);
			font-weight: 700;
		}

		hr {
			margin: 1.5rem 0;
			border: 0;
			border-top: 3px solid #ffffff;
		}

		p {
			margin: 0;
			font-size: 1.1rem;
			line-height: 1.6;
		}
        p2 {
			margin: 0;
			font-size: 0.6rem;
			line-height: 1.6;
		}

		a {
			color: #30c4ff;
		}
	</style>
</head>
<body>
	<main>
		<img src="https://turntables.dev/oddish.jpg" alt="oddish">
		<h1>turntables.dev</h1>
		<hr>
		<p>idk what to put here rn since i really need to overhaul this site but if you want the older version of the site that had more stuff then <a href="https://turntables.dev/tools">here</a></p>
        <p2>alternatively you can go <a href="https://turntables.dev/links">here</a> for a list of links including that and some others</p2>

	</main>
</body>
</html>
